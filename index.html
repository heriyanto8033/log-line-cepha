return html`<div className="fixed inset-0 z-20 flex items-end justify-center bg-black/50 sm:items-center"><div className=${CD+' w-full max-w-sm rounded-b-none pb-[calc(1rem+env(safe-area-inset-bottom,0px))] sm:rounded-b-xl'}>
<div className="mb-3 flex items-center justify-between"><h2 className="font-semibold">Reset Password · ${u.username}</h2><button aria-label="Tutup" onClick=${onClose}>${ic('X',20)}</button></div>
<div className="space-y-3"><p className="text-sm text-mute">Hitungan salah login direset ke 0, blokir dibuka, dan masa berlaku password diperpanjang ${PWD} hari.</p>
<${F} l="Password Baru"><input type="password" className=${IN} value=${p} onChange=${e=>setP(e.target.value)} /><//>
<${F} l="Ulangi Password Baru"><input type="password" className=${IN} value=${c} onChange=${e=>setC(e.target.value)} /><//>
<${Er} t=${er} /></div>
<div className="mt-4 grid grid-cols-2 gap-2"><button className=${OU} onClick=${onClose}>Batal</button><button className=${PR} onClick=${()=>{if(p!==c)return setEr('Konfirmasi password tidak sama.');const e=onSave(p);if(e)setEr(e)}}>Simpan Password</button></div></div></div>`};

const Usr=({users,me,onTog})=>html`<div className="space-y-3"><section className=${CD}><h2 className="mb-2 font-semibold">Tambah User / Reset Password</h2><p className="text-sm text-mute">Dilakukan oleh Admin di dashboard Supabase: Authentication → Users. Setelah akun dibuat, daftarkan nama dan perannya lewat SQL sesuai panduan.</p></section>
<section className=${CD}><h2 className="mb-2 font-semibold">Daftar User</h2><div className="divide-y divide-line">${users.map(u=>html`<div key=${u.id} className="flex items-start justify-between gap-2 py-3"><div><p className="text-sm font-medium">${u.name} <span className="text-mute">(${u.username})</span></p><p className="text-xs text-mute">${u.label||u.role}</p></div><div className="flex flex-col items-end gap-1"><${Bd} c=${u.active?GR:RD}>${u.active?'Aktif':'Nonaktif'}<//>${u.id!==me.id&&me.role==='Admin'&&html`<button className=${OU+' px-2 py-1 text-xs'} onClick=${()=>onTog(u)}>${u.active?'Nonaktifkan':'Aktifkan'}</button>`}</div></div>`)}</div></section></div>`;

const App=()=>{
const[users,setUsers]=useState([]),[R0,setR]=useState([]),[A,setA]=useState([]),[me,setMe]=useP(K.s,null);
const[ready,setReady]=useState(false),[sync,setSync]=useState('loading'),[syncErr,setSyncErr]=useState('');
const R=R0.map(r=>r.a?r:{...r,a:{o:[],ev:[]}});
const[tab,setTab]=useState(me&&me.role!=='Operator'?'mon':'input'),[d,setD]=useState(blank),[fix,setFix]=useState(null),[msg,setMsg]=useState(null),[err,setErr]=useState(''),[pv,setPv]=useState(null);
const say=(t,ok=1)=>{setMsg({t,ok});setTimeout(()=>setMsg(null),ok?3500:5500)};
const[gm,setGm]=useState(null);
const fail=(t,k)=>{say(t,0);if(k)setGm({k,n:Date.now()});else window.scrollTo({top:0,behavior:'smooth'})};

const saveCloud=async(k,val)=>{
  svLocal(k,val);
  setSync('saving');
  try{
    await sbSet(k,val);
    setSync('ok');
    setSyncErr('');
  }catch(e){
    setSync('err');
    setSyncErr(e.message||String(e));
    say('Gagal menyimpan ke Supabase: '+(e.message||'cek koneksi'),0);
  }
};
const upR=fn=>setR(p=>{const n=typeof fn==='function'?fn(p):fn;saveCloud(K.r,n);return n});
const upA=fn=>setA(p=>{const n=typeof fn==='function'?fn(p):fn;saveCloud(K.a,n);return n});

const getProfile=async id=>{const{data,error}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();if(error)throw error;return data&&data.active?{id:data.id,name:data.name,label:data.label||data.role,role:data.role,username:data.username}:null};
const syncFromCloud=async(init=false)=>{
  try{
    const map=await sbGetAll();
    if(map[K.r]){setR(map[K.r]);svLocal(K.r,map[K.r])}
    else if(init){const r=ld(K.r,[]);setR(r);if(r.length)await sbSet(K.r,r)}
    if(map[K.a]){setA(map[K.a]);svLocal(K.a,map[K.a])}
    else if(init){const a=ld(K.a,[]);setA(a);if(a.length)await sbSet(K.a,a)}
    const{data:pf}=await sb.from('profiles').select('*').order('name');
    setUsers(pf||[]);
    setSync('ok');setSyncErr('');
    if(!init)say('Data terbaru berhasil dimuat dari Supabase.');
  }catch(e){
    const m=e.message||String(e);
    setSyncErr(m);
    if(init){setR(ld(K.r,[]));setA(ld(K.a,[]))}else say('Gagal memuat dari Supabase: '+m,0);
    setSync('err');
  }
};
const boot=async()=>{
  try{
    if(!sb)throw new Error('Pustaka Supabase belum termuat. Periksa internet lalu muat ulang.');
    const{data:{session}}=await sb.auth.getSession();
    const pr=session?await getProfile(session.user.id):null;
    if(pr){await syncFromCloud(true);setMe(pr)}
    else{if(session)await sb.auth.signOut();setMe(null);setSync('ok');setSyncErr('')}
  }catch(e){setSyncErr(e.message||String(e));setSync('err');setMe(null)}
  finally{setReady(true)}
};

useEffect(()=>{boot()},[]);

const log=(u,a,x)=>upA(p=>[...p,{t:ts(),u,a,x}]);
const login=async(un,pw)=>{
const u=(un||'').trim().toLowerCase();
if(!u||!pw){setErr('Isi username dan password.');return}
if(!sb){setErr('Pustaka Supabase belum termuat. Muat ulang halaman.');return}
try{
const{data,error}=await sb.auth.signInWithPassword({email:u+'@'+ED,password:pw});
if(error){setErr('Username atau password salah.');return}
const pr=await getProfile(data.user.id);
if(!pr){await sb.auth.signOut();setErr('Akun nonaktif atau belum terdaftar. Hubungi Admin.');return}
await syncFromCloud(true);
setErr('');try{localStorage.setItem('lc_last',String(Date.now()))}catch(x){}
setMe(pr);setTab(pr.role==='Operator'?'input':'mon');
log(pr.name,'Login','Login berhasil sebagai '+pr.label)
}catch(e){setErr('Gagal masuk: '+(e.message||'cek koneksi internet'))}};
const outNow=()=>{setTimeout(()=>{try{sb.auth.signOut()}catch(e){}},1500);setMe(null)};
const logout=()=>{log(me.name,'Logout','Keluar dari sistem');outNow()};
useEffect(()=>{
if(!me||!ready)return;
const IDLE=10*60*1000,LK='lc_last';
const mark=()=>{try{localStorage.setItem(LK,String(Date.now()))}catch(e){}};
const last=()=>{try{return +localStorage.getItem(LK)||0}catch(e){return 0}};
if(!last())mark();
let th=0;
const act=()=>{const n=Date.now();if(n-th>5000){th=n;mark()}};
const chk=()=>{if(Date.now()-last()>IDLE){log(me.name,'Logout Otomatis','Tidak ada aktivitas selama 10 menit');outNow();setErr('Sesi berakhir karena tidak ada aktivitas selama 10 menit. Silakan masuk kembali.')}};
const evs=['pointerdown','keydown','touchstart','scroll','input'];
evs.forEach(e=>window.addEventListener(e,act,true));
const iv=setInterval(chk,15000);
document.addEventListener('visibilitychange',chk);
chk();
return()=>{evs.forEach(e=>window.removeEventListener(e,act,true));clearInterval(iv);document.removeEventListener('visibilitychange',chk)};
},[me,ready]);

const submit=()=>{
if(!d.date||!d.product.trim()||!d.batch.trim())return fail('Lengkapi tanggal, nama produk, dan nomor batch.');
const bad=M.flatMap(m=>m.f.map(([f,l])=>[m.k,f,l])).find(([k,f])=>d[k][f]===''||+d[k][f]<0);
if(bad)return fail('Isi angka yang valid: '+bad[2]+'.',bad[0]);
if(+d.w.sisa>+d.w.in)return fail('Sisa Tunnel tidak boleh melebihi Vial Masuk.','w');
if(d.a.o.some(o=>o.t==='Lainnya'?!o.n.trim()||!String(o.q).trim():o.q===''||+o.q<0))return fail('Lengkapi nama item dan jumlah pada Output Autoclave.','a');
{const bm=M.find(m=>d[m.k].ev.some(e=>!e.s||!e.e));if(bm)return fail('Lengkapi waktu mulai dan selesai di semua kejadian.',bm.k)}
const nm=k=>Object.fromEntries(Object.entries(d[k]).map(([f,v])=>[f,f==='ev'?v:f==='partner'?String(v).trim():+v]));
const r={id:Date.now(),date:d.date,shift:d.shift,product:d.product.trim(),batch:d.batch.trim(),w:nm('w'),f:nm('f'),c:nm('c'),a:{o:d.a.o.map(o=>o.t==='Lainnya'?{...o,n:o.n.trim(),q:String(o.q).trim()}:{...o,n:'',q:+o.q}),ev:d.a.ev},by:me.name,at:ts(),st:'Menunggu',cor:[]};
upR(p=>[...p,r]);log(me.name,'Submit Laporan','Batch '+r.batch+' · '+fd(r.date)+' '+r.shift+' · Yield '+pc(yl(r)));setD(blank());say('Laporan berhasil disubmit.');setTab('mon')};
const ok=r=>{upR(p=>p.map(x=>x.id===r.id?{...x,st:'Terverifikasi',vb:me.name,vat:ts()}:x));log(me.name,'Verifikasi','Approve laporan Batch '+r.batch+' ('+fd(r.date)+' '+r.shift+')');say('Laporan terverifikasi.')};
const save=(r,f,why)=>{if(me.role==='Operator'&&(R.find(x=>x.id===r.id)||r).st==='Terverifikasi')return 'Operator tidak dapat mengoreksi laporan yang sudah terverifikasi.';const ch=[];let n=r;
for(const[p,l]of CF){const o=get(r,p),v=f[p];if(String(o)===String(v))continue;
if(isN(p)&&(String(v).trim()===''||+v<0))return 'Nilai angka tidak valid: '+l;
if(!isN(p)&&!String(v).trim())return 'Kolom tidak boleh kosong: '+l;
const nv=isN(p)?+v:String(v).trim();ch.push([l,o,nv]);n=put(n,p,nv)}
const ob=r.a.o,eo=f.o||ob;
if(eo.some(o=>o.t==='Lainnya'?!String(o.n).trim()||!String(o.q).trim():String(o.q).trim()===''||+o.q<0))return 'Lengkapi nama item dan jumlah Output Autoclave (angka tidak boleh negatif).';
const no=eo.map(o=>o.t==='Lainnya'?{...o,n:String(o.n).trim(),q:String(o.q).trim()}:{...o,n:'',q:+o.q});
ob.forEach((o,i)=>{const x=no.find(y=>y.id===o.id),a=oTxt(o),b=x?oTxt(x):'(dihapus)';if(a!==b)ch.push(['Output Autoclave · Item '+(i+1),a,b])});
n={...n,a:{...n.a,o:no}};
if(!ch.length)return 'Belum ada nilai yang diubah.';
if(n.w.sisa>n.w.in)return 'Sisa Tunnel tidak boleh melebihi Vial Masuk.';
if(!why.trim())return 'Alasan Koreksi (Reason for Change) wajib diisi.';
const nr={...n,st:'Menunggu',vb:null,vat:null,cor:[...r.cor,{t:ts(),u:me.name,ch,why:why.trim()}]};
upR(p=>p.map(x=>x.id===r.id?nr:x));
log(me.name,'Koreksi Data','Batch '+r.batch+' ('+fd(r.date)+' '+r.shift+'): '+ch.map(c=>c[0]+': '+c[1]+' → '+c[2]).join('; ')+' | Alasan: '+why.trim());
setFix(null);say('Koreksi tersimpan. Laporan perlu diverifikasi ulang.');return ''};
const tog=async u=>{const{data:ch,error}=await sb.from('profiles').update({active:!u.active}).eq('id',u.id).select();
if(error||!ch||!ch.length)return say('Gagal mengubah status: '+(error?error.message:'tidak diizinkan'),0);
setUsers(p=>p.map(x=>x.id===u.id?{...x,active:!u.active}:x));
log(me.name,u.active?'Nonaktifkan User':'Aktifkan User',u.name+' ('+u.username+')');say('Status user diubah.')};
const fn=(fl,x)=>'LogLineCepha_'+x+(fl.m?'_'+M.find(m=>m.k===fl.m).s:'')+'_'+(fl.a||'awal')+'_sd_'+(fl.z||today())+'.xlsx';
const chk=()=>window.XLSX||(say('Pustaka Excel belum termuat. Periksa koneksi internet lalu muat ulang.',0),0);
const xProdF=(L,fl)=>{if(!chk())return;const n=fn(fl,'Produksi');xl(n,xProd(L,fl,me.name));log(me.name,'Export Excel',L.length+' laporan · '+mn(fl)+' · '+rng(fl)+' ('+n+')');say('File Excel diunduh.')};
const pProdF=(L,fl)=>{setPv(rpt('Laporan Produksi dan Performa Line · '+mn(fl),fl,me.name,pProd(L,fl)));log(me.name,'Export PDF',L.length+' laporan · '+mn(fl)+' · '+rng(fl))};
const pAudF=(L,fl)=>{setPv(rpt('Laporan Audit Trail',fl,me.name,'<p>Jumlah catatan: <b>'+L.length+'</b></p>'+tb(['Timestamp','User','Aksi','Detail'],L.map(a=>[a.t,a.u,a.a,a.x]))));log(me.name,'Export Audit Trail PDF',L.length+' catatan · '+rng(fl))};

if(!ready)return html`<div className="grid min-h-[100dvh] place-items-center p-4 text-center"><div><div className="mx-auto mb-3 grid h-14 w-14 animate-pulse place-items-center rounded-2xl bg-navy text-white">${ic('Factory',28)}</div><p className="font-semibold">Log Line Cepha</p><p className="mt-1 text-sm text-mute">Menghubungkan ke database Supabase...</p></div></div>`;
if(!me)return html`<${Login} onLogin=${login} err=${err} sync=${sync} syncErr=${syncErr} onRetry=${boot} />`;
const V=me.role!=='Operator',T=[...(V?[]:[['input','Input Laporan','ClipboardList']]),['mon','Monitoring','ListChecks'],...(V?[['ana','Analisa & Export','BarChart3'],['aud','Audit Trail','History']]:[]),...(me.role==='Admin'?[['usr','Kelola User','Users']]:[])];
return html`<div className="pb-24"><header className="bg-navy text-white"><div className="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
<div className="flex items-center gap-2">${ic('Factory',22)}<div><p className="font-semibold leading-tight">Log Line Cepha</p><p className="text-xs opacity-85">${sync==='saving'?'Menyimpan ke Cloud...':sync==='ok'?'Cloud Supabase Aktif':'Offline (Lokal)'}</p></div></div>
<div className="flex items-center gap-2"><button className="rounded-lg bg-white/15 p-2" aria-label="Sinkronkan Data" title="Muat ulang data dari Cloud" onClick=${()=>syncFromCloud(false)}>${ic('RefreshCw',18)}</button><div className="text-right text-xs leading-tight"><p className="font-medium">${me.name}</p><p className="opacity-75">${me.label}</p></div><button className="rounded-lg bg-white/15 p-2" aria-label="Keluar" onClick=${logout}>${ic('LogOut',18)}</button></div></div>
<nav className="mx-auto flex max-w-3xl gap-1 overflow-x-auto px-3 pb-2">${T.map(([k,n,i])=>html`<button key=${k} onClick=${()=>setTab(k)} className=${'flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-2 text-sm '+(tab===k?'bg-white font-medium text-slate-900':'text-white/80')}>${ic(i)} ${n}</button>`)}</nav></header>
<main className="mx-auto max-w-3xl p-3">
${tab==='input'&&!V&&html`<${Inp} d=${d} setD=${setD} submit=${submit} gm=${gm} />`}
${tab==='mon'&&html`<${Mon} R=${R} me=${me} onFix=${setFix} onOk=${ok} />`}
${tab==='ana'&&V&&html`<${Ana} R=${R} onX=${xProdF} onP=${pProdF} />`}
${tab==='aud'&&V&&html`<${Aud} A=${A} onP=${pAudF} />`}
${tab==='usr'&&me.role==='Admin'&&html`<${Usr} users=${users} me=${me} onTog=${tog} />`}</main>
${fix&&html`<${Fix} r=${fix} onClose=${()=>setFix(null)} onSave=${save} />`}
${pv&&html`<${Prev} h=${pv} onClose=${()=>setPv(null)} />`}
${msg&&html`<div className=${'fixed inset-x-3 bottom-4 z-30 mx-auto mb-[env(safe-area-inset-bottom,0px)] max-w-sm rounded-lg px-4 py-3 text-sm text-white shadow-lg '+(msg.ok?'bg-emerald-600':'bg-rose-600')}>${msg.t}</div>`}</div>`};
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
